<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="540" fill="#0f1420"/>
  <text x="440" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">From Logs to Alerts — the SIEM Pipeline &amp; the Portable Rule</text>
  <text x="440" y="52" fill="#8b98a5" font-size="13" text-anchor="middle">Splunk stores &amp; searches the logs; Sigma is the vendor-neutral rule that compiles to ANY SIEM</text>

  <!-- sources -->
  <text x="105" y="86" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">log sources</text>
  <g font-size="11">
    <rect x="30" y="96" width="150" height="26" fill="#161b22" stroke="#a371f7"/><text x="40" y="114" fill="#d6a2ff">Sysmon (Event IDs)</text>
    <rect x="30" y="126" width="150" height="26" fill="#161b22" stroke="#58a6ff"/><text x="40" y="144" fill="#79c0ff">Zeek logs</text>
    <rect x="30" y="156" width="150" height="26" fill="#161b22" stroke="#f85149"/><text x="40" y="174" fill="#ff7b72">firewall / IDS</text>
    <rect x="30" y="186" width="150" height="26" fill="#161b22" stroke="#2ea043"/><text x="40" y="204" fill="#3fb950">cloud audit logs</text>
  </g>
  <line x1="180" y1="154" x2="230" y2="154" stroke="#8b98a5" stroke-width="1.5"/><polygon points="230,154 221,150 221,158" fill="#8b98a5"/>

  <!-- SIEM (Splunk) -->
  <rect x="232" y="92" width="360" height="128" fill="#161b22" stroke="#f2cc60"/>
  <text x="246" y="114" fill="#f2cc60" font-size="14" font-weight="700">SIEM · Splunk (store + search at scale)</text>
  <text x="246" y="138" fill="#8b98a5" font-size="11.5">1. ingest → index  (source · sourcetype · host)</text>
  <text x="246" y="158" fill="#8b98a5" font-size="11.5">2. field extraction (search-time)</text>
  <rect x="246" y="168" width="332" height="24" fill="#0f1420" stroke="#30363d"/>
  <text x="254" y="185" fill="#f2cc60" font-size="10.5">index=win EventCode=1 | stats count by ParentImage</text>
  <text x="246" y="210" fill="#8b98a5" font-size="11.5">3. save as an alert → fires on a match</text>
  <line x1="592" y1="154" x2="640" y2="154" stroke="#8b98a5" stroke-width="1.5"/><polygon points="640,154 631,150 631,158" fill="#8b98a5"/>
  <rect x="642" y="132" width="210" height="44" rx="6" fill="#3a1d24" stroke="#f85149"/>
  <text x="747" y="152" fill="#ff7b72" font-size="13" text-anchor="middle" font-weight="700">ALERT</text>
  <text x="747" y="168" fill="#8b98a5" font-size="10.5" text-anchor="middle">→ analyst / SOAR</text>

  <!-- Sigma -->
  <rect x="30" y="240" width="820" height="120" fill="#1c2333" stroke="#a371f7"/>
  <text x="46" y="264" fill="#d6a2ff" font-size="14" font-weight="700">Sigma — write the detection ONCE, run it anywhere</text>
  <rect x="46" y="276" width="250" height="70" fill="#0f1420" stroke="#30363d"/>
  <text x="56" y="294" fill="#adbac7" font-size="10.5">detection:</text>
  <text x="56" y="310" fill="#adbac7" font-size="10.5">  sel: {ParentImage: winword.exe,</text>
  <text x="56" y="326" fill="#adbac7" font-size="10.5">        Image: powershell.exe}</text>
  <text x="56" y="342" fill="#adbac7" font-size="10.5">  condition: sel   (one YAML rule)</text>
  <text x="320" y="300" fill="#8b98a5" font-size="20">→</text>
  <text x="350" y="292" fill="#8b98a5" font-size="11.5">pySigma / sigmac compiles the SAME rule to:</text>
  <g font-size="11">
    <rect x="350" y="302" width="150" height="24" fill="#0f1420" stroke="#f2cc60"/><text x="358" y="319" fill="#f2cc60">Splunk SPL</text>
    <rect x="510" y="302" width="150" height="24" fill="#0f1420" stroke="#58a6ff"/><text x="518" y="319" fill="#79c0ff">Elastic KQL</text>
    <rect x="670" y="302" width="160" height="24" fill="#0f1420" stroke="#2ea043"/><text x="678" y="319" fill="#3fb950">Sentinel KQL …</text>
    <text x="350" y="342" fill="#8b98a5">a detection that isn't locked to one vendor — the "GitHub of detections".</text>
  </g>

  <!-- key -->
  <rect x="30" y="376" width="820" height="146" fill="#161b22" stroke="#a371f7"/>
  <text x="46" y="402" fill="#d6a2ff" font-size="14" font-weight="700">Platform vs. rule</text>
  <text x="46" y="428" fill="#f2cc60" font-size="12">Splunk = the SIEM: ingest huge log volume, index it, and search with SPL (`stats`, `timechart`, `eval`). The</text>
  <text x="46" y="448" fill="#8b98a5" font-size="12">   detection is a saved SPL search that alerts. Powerful, but the query language is Splunk-specific.</text>
  <text x="46" y="474" fill="#d6a2ff" font-size="12">Sigma = the portable RULE FORMAT: one YAML describing the logic, compiled to whichever backend you run.</text>
  <text x="46" y="494" fill="#8b98a5" font-size="12">   Share a Sigma rule and anyone on any SIEM can deploy it — detection engineering that survives a tool switch.</text>
  <text x="46" y="516" fill="#3fb950" font-size="12">Detection engineering = write the logic in Sigma, run it on your SIEM, tune the false positives against real data.</text>
</svg>
