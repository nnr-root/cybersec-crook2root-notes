<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="860" height="600" fill="#0f1420"/>
  <text x="430" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Privilege-Escalation Enumeration Surface</text>
  <text x="430" y="56" fill="#8b98a5" font-size="13" text-anchor="middle">what PEAS scripts check on each platform — a low-priv shell looking for one misconfiguration</text>

  <!-- center foothold -->
  <rect x="360" y="72" width="140" height="40" rx="6" fill="#3a1d24" stroke="#f85149"/>
  <text x="430" y="97" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">low-priv shell</text>

  <!-- LINUX column (LinPEAS) -->
  <text x="215" y="146" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">Linux · LinPEAS</text>
  <g font-size="12.5">
    <rect x="40" y="158" width="350" height="34" fill="#132b1e" stroke="#2ea043"/><text x="52" y="180" fill="#3fb950">SUID / SGID binaries  →  GTFOBins</text>
    <rect x="40" y="196" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="218" fill="#adbac7">sudo -l rules (NOPASSWD, env_keep)</text>
    <rect x="40" y="234" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="256" fill="#adbac7">cron jobs &amp; writable scripts</text>
    <rect x="40" y="272" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="294" fill="#adbac7">writable PATH / world-writable files</text>
    <rect x="40" y="310" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="332" fill="#adbac7">capabilities (cap_setuid…)</text>
    <rect x="40" y="348" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="370" fill="#adbac7">kernel version → known exploit</text>
    <rect x="40" y="386" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="408" fill="#adbac7">creds in files / history / .env</text>
    <rect x="40" y="424" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="446" fill="#adbac7">docker / lxc group · NFS no_root_squash</text>
  </g>

  <!-- WINDOWS column (WinPEAS) -->
  <text x="645" y="146" fill="#58a6ff" font-size="16" font-weight="700" text-anchor="middle">Windows · WinPEAS</text>
  <g font-size="12.5">
    <rect x="470" y="158" width="350" height="34" fill="#1c2333" stroke="#58a6ff"/><text x="482" y="180" fill="#79c0ff">token privs: SeImpersonate → Potato</text>
    <rect x="470" y="196" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="218" fill="#adbac7">unquoted service paths</text>
    <rect x="470" y="234" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="256" fill="#adbac7">weak service / registry perms</text>
    <rect x="470" y="272" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="294" fill="#adbac7">AlwaysInstallElevated</text>
    <rect x="470" y="310" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="332" fill="#adbac7">autoruns &amp; scheduled tasks</text>
    <rect x="470" y="348" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="370" fill="#adbac7">saved creds · DPAPI · cmdkey</text>
    <rect x="470" y="386" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="408" fill="#adbac7">UAC status &amp; bypass paths</text>
    <rect x="470" y="424" width="350" height="34" fill="#161b22" stroke="#30363d"/><text x="482" y="446" fill="#adbac7">unattend.xml / GPP passwords</text>
  </g>

  <!-- connectors -->
  <line x1="390" y1="92" x2="215" y2="158" stroke="#2ea043" stroke-width="1.5"/>
  <line x1="470" y1="92" x2="645" y2="158" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- key -->
  <rect x="40" y="474" width="780" height="98" fill="#161b22" stroke="#e3a008"/>
  <text x="56" y="500" fill="#f2cc60" font-size="14" font-weight="700">How PEAS is read (colour = signal, not proof)</text>
  <text x="56" y="524" fill="#8b98a5" font-size="12">RED/highlighted lines = 95% likely a real finding · YELLOW = worth checking · the tool ranks, you verify.</text>
  <text x="56" y="544" fill="#8b98a5" font-size="12">Each vector maps to a concrete exploit (SUID→GTFOBins, SeImpersonate→PrintSpoofer/Potato, unquoted→plant EXE).</text>
  <text x="56" y="564" fill="#8b98a5" font-size="12">PEAS only ENUMERATES; it changes nothing — the operator picks one vector and exploits it deliberately.</text>
</svg>
