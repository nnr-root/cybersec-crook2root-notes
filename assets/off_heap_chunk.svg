<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="820" height="540" fill="#0f1420"/>
  <text x="410" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">glibc malloc Chunk Layout (allocated vs. free)</text>
  <text x="410" y="56" fill="#8b98a5" font-size="13" text-anchor="middle">the 8 bytes returned to the user are preceded by metadata; freeing repurposes user data as list pointers</text>

  <!-- ALLOCATED chunk -->
  <text x="210" y="92" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">ALLOCATED chunk</text>
  <rect x="60" y="100" width="300" height="40" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="125" fill="#8b98a5" font-size="13">prev_size (only if prev is free)</text>
  <rect x="60" y="140" width="300" height="46" fill="#1c2333" stroke="#e3a008"/>
  <text x="72" y="160" fill="#f2cc60" font-size="13">size  |  A  M  P</text>
  <text x="72" y="178" fill="#8b98a5" font-size="11">low 3 bits are flags; P = prev_inuse</text>
  <rect x="60" y="186" width="300" height="120" fill="#132b1e" stroke="#2ea043"/>
  <text x="72" y="214" fill="#3fb950" font-size="13" font-weight="700">user data  ← malloc() returns here</text>
  <text x="72" y="238" fill="#8b98a5" font-size="12">chunk_ptr + 0x10</text>
  <text x="72" y="270" fill="#8b98a5" font-size="12">a write past the end corrupts the</text>
  <text x="72" y="288" fill="#8b98a5" font-size="12">NEXT chunk's size field (overflow)</text>

  <!-- FREE chunk -->
  <text x="610" y="92" fill="#ff7b72" font-size="16" font-weight="700" text-anchor="middle">FREE chunk (in a bin)</text>
  <rect x="460" y="100" width="300" height="40" fill="#161b22" stroke="#30363d"/>
  <text x="472" y="125" fill="#8b98a5" font-size="13">prev_size</text>
  <rect x="460" y="140" width="300" height="46" fill="#1c2333" stroke="#e3a008"/>
  <text x="472" y="160" fill="#f2cc60" font-size="13">size  |  A  M  P</text>
  <text x="472" y="178" fill="#8b98a5" font-size="11">same header as allocated</text>
  <rect x="460" y="186" width="300" height="40" fill="#3a1d24" stroke="#f85149"/>
  <text x="472" y="211" fill="#ff7b72" font-size="13" font-weight="700">fd — forward pointer (next free)</text>
  <rect x="460" y="226" width="300" height="40" fill="#3a1d24" stroke="#f85149"/>
  <text x="472" y="251" fill="#ff7b72" font-size="13" font-weight="700">bk — back pointer (prev free)</text>
  <rect x="460" y="266" width="300" height="40" fill="#161b22" stroke="#30363d"/>
  <text x="472" y="291" fill="#8b98a5" font-size="13">old user data (now unused)</text>

  <!-- key insight boxes -->
  <rect x="60" y="336" width="700" height="70" fill="#161b22" stroke="#a371f7"/>
  <text x="76" y="362" fill="#d6a2ff" font-size="14" font-weight="700">Use-After-Free</text>
  <text x="76" y="384" fill="#8b98a5" font-size="12">a dangling pointer still references a freed chunk whose fd/bk the attacker controls;</text>
  <text x="76" y="400" fill="#8b98a5" font-size="12">reallocation places attacker bytes where live code will later dereference them.</text>

  <rect x="60" y="416" width="700" height="70" fill="#161b22" stroke="#2ea043"/>
  <text x="76" y="442" fill="#3fb950" font-size="14" font-weight="700">Heap overflow → metadata corruption</text>
  <text x="76" y="464" fill="#8b98a5" font-size="12">overwriting the next chunk's size, or a freed chunk's fd, underlies tcache poisoning</text>
  <text x="76" y="480" fill="#8b98a5" font-size="12">and fastbin attacks: a forged fd makes malloc() hand back an arbitrary address.</text>
</svg>
