<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="860" height="580" fill="#0f1420"/>
  <text x="430" y="32" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Two Roads to a Foothold</text>
  <text x="430" y="54" fill="#8b98a5" font-size="13" text-anchor="middle">exploit a vulnerability, or guess a credential — both end at initial access</text>

  <!-- LEFT: Metasploit -->
  <text x="215" y="88" fill="#f85149" font-size="16" font-weight="700" text-anchor="middle">Metasploit — exploit a bug</text>
  <g font-size="12.5">
    <rect x="60" y="100" width="310" height="40" fill="#3a1d24" stroke="#f85149"/><text x="72" y="125" fill="#ff7b72">1. exploit MODULE — targets a specific CVE</text>
    <rect x="60" y="146" width="310" height="40" fill="#161b22" stroke="#30363d"/><text x="72" y="171" fill="#adbac7">2. PAYLOAD — what runs after (meterpreter/shell)</text>
    <rect x="60" y="192" width="310" height="40" fill="#161b22" stroke="#30363d"/><text x="72" y="217" fill="#adbac7">3. OPTIONS — RHOSTS, LHOST, LPORT</text>
    <rect x="60" y="238" width="310" height="40" fill="#132b1e" stroke="#2ea043"/><text x="72" y="263" fill="#3fb950">4. run → SESSION opens</text>
  </g>
  <text x="72" y="300" fill="#8b98a5" font-size="11">needs: a VULNERABILITY to exploit</text>
  <text x="72" y="318" fill="#8b98a5" font-size="11">staged = small stager pulls the rest · stageless = all at once</text>

  <!-- RIGHT: Hydra -->
  <text x="645" y="88" fill="#58a6ff" font-size="16" font-weight="700" text-anchor="middle">Hydra — guess a credential</text>
  <g font-size="12.5">
    <rect x="490" y="100" width="310" height="40" fill="#1c2333" stroke="#58a6ff"/><text x="502" y="125" fill="#79c0ff">1. SERVICE — ssh, ftp, rdp, http-form-post</text>
    <rect x="490" y="146" width="310" height="40" fill="#161b22" stroke="#30363d"/><text x="502" y="171" fill="#adbac7">2. -L users.txt  -P passwords.txt</text>
    <rect x="490" y="192" width="310" height="40" fill="#33261a" stroke="#e3a008"/><text x="502" y="217" fill="#f2cc60">3. ONLINE attempts vs the LIVE service</text>
    <rect x="490" y="238" width="310" height="40" fill="#132b1e" stroke="#2ea043"/><text x="502" y="263" fill="#3fb950">4. valid pair → LOGIN</text>
  </g>
  <text x="502" y="300" fill="#8b98a5" font-size="11">needs: a WEAK credential + no lockout</text>
  <text x="502" y="318" fill="#8b98a5" font-size="11">online = slow, rate-limited, LOGGED, can lock accounts</text>

  <!-- converge -->
  <line x1="215" y1="330" x2="400" y2="372" stroke="#2ea043" stroke-width="1.5"/>
  <line x1="645" y1="330" x2="460" y2="372" stroke="#2ea043" stroke-width="1.5"/>
  <rect x="315" y="374" width="230" height="46" rx="6" fill="#132b1e" stroke="#2ea043"/>
  <text x="430" y="402" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">FOOTHOLD / session</text>

  <!-- key -->
  <rect x="60" y="440" width="740" height="126" fill="#161b22" stroke="#a371f7"/>
  <text x="76" y="466" fill="#d6a2ff" font-size="14" font-weight="700">The distinction that matters</text>
  <text x="76" y="490" fill="#8b98a5" font-size="12">• Exploit (Metasploit) needs a software BUG; a patched target simply has no door to open.</text>
  <text x="76" y="510" fill="#8b98a5" font-size="12">• Brute-force (Hydra) needs a WEAK PASSWORD and no lockout; it is ONLINE — loud, logged, and lock-out-prone.</text>
  <text x="76" y="530" fill="#8b98a5" font-size="12">• Contrast with OFFLINE cracking (John/Hashcat): those attack captured HASHES at full speed, never touching</text>
  <text x="76" y="548" fill="#8b98a5" font-size="12">  the target. Hydra guesses at the live login; the cracker guesses at a stolen hash. Both authorized-only.</text>
</svg>
