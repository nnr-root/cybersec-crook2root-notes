<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="800" height="600" fill="#0f1420"/>
  <text x="400" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">ROP Chain on the Stack — system("/bin/sh")</text>
  <text x="400" y="56" fill="#8b98a5" font-size="13" text-anchor="middle">each gadget ends in `ret`, which pops the next address into RIP — the stack becomes a program</text>

  <!-- stack column x=250..550 -->
  <text x="400" y="88" fill="#8b98a5" font-size="12" text-anchor="middle">lower addr ↑   (RSP advances downward through the chain)   ↓ higher addr</text>

  <!-- overflow padding -->
  <rect x="250" y="100" width="300" height="46" fill="#3a1d24" stroke="#f85149"/>
  <text x="265" y="128" fill="#ff7b72" font-size="13">"AAAA…" padding fills buf + saved RBP</text>

  <!-- entry: overwritten saved RIP = gadget1 -->
  <rect x="250" y="146" width="300" height="46" fill="#1c2333" stroke="#58a6ff"/>
  <text x="265" y="174" fill="#79c0ff" font-size="13">&amp;gadget1: pop rdi ; ret</text>

  <rect x="250" y="192" width="300" height="46" fill="#132b1e" stroke="#2ea043"/>
  <text x="265" y="220" fill="#3fb950" font-size="13">&amp;"/bin/sh"  → popped into RDI (arg1)</text>

  <rect x="250" y="238" width="300" height="46" fill="#1c2333" stroke="#58a6ff"/>
  <text x="265" y="266" fill="#79c0ff" font-size="13">&amp;gadget2: ret  (stack align for movaps)</text>

  <rect x="250" y="284" width="300" height="46" fill="#33261a" stroke="#e3a008"/>
  <text x="265" y="312" fill="#f2cc60" font-size="13">&amp;system  → called with RDI = "/bin/sh"</text>

  <rect x="250" y="330" width="300" height="40" fill="#161b22" stroke="#30363d"/>
  <text x="265" y="355" fill="#8b98a5" font-size="13">&amp;exit  (clean return)</text>

  <!-- RSP pointer that walks down -->
  <text x="600" y="128" fill="#58a6ff" font-size="13">① saved RIP hijacked</text>
  <line x1="596" y1="124" x2="552" y2="124" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="600" y="215" fill="#3fb950" font-size="13">② pop rdi loads arg</text>
  <line x1="596" y1="211" x2="552" y2="211" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600" y="307" fill="#f2cc60" font-size="13">③ system() executes</text>
  <line x1="596" y1="303" x2="552" y2="303" stroke="#e3a008" stroke-width="1.5"/>

  <!-- why -->
  <rect x="70" y="400" width="660" height="86" fill="#161b22" stroke="#a371f7"/>
  <text x="88" y="426" fill="#d6a2ff" font-size="14" font-weight="700">Why ROP exists: NX / DEP</text>
  <text x="88" y="448" fill="#8b98a5" font-size="12">the stack is writable but non-executable, so injected shellcode won't run. ROP</text>
  <text x="88" y="464" fill="#8b98a5" font-size="12">instead chains tiny existing snippets ("gadgets") that already end in `ret`,</text>
  <text x="88" y="480" fill="#8b98a5" font-size="12">reusing legitimate .text bytes — no new executable memory. ASLR still needs a leak.</text>

  <rect x="70" y="500" width="660" height="70" fill="#161b22" stroke="#2ea043"/>
  <text x="88" y="526" fill="#3fb950" font-size="14" font-weight="700">The mechanism in one line</text>
  <text x="88" y="548" fill="#8b98a5" font-size="12">`ret` = `pop rip`. Fill the stack with addresses, and every `ret` fetches the</text>
  <text x="88" y="564" fill="#8b98a5" font-size="12">next instruction — the return slot you overflowed is the chain's first entry.</text>
</svg>
