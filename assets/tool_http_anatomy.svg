<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="860" height="580" fill="#0f1420"/>
  <text x="430" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Anatomy of an HTTP Request &amp; Response</text>
  <text x="430" y="56" fill="#8b98a5" font-size="13" text-anchor="middle">what curl builds and Postman visualizes — the four parts of each message</text>

  <!-- REQUEST -->
  <text x="60" y="88" fill="#58a6ff" font-size="15" font-weight="700">REQUEST  (client → server)</text>
  <rect x="40" y="98" width="780" height="34" fill="#1c2333" stroke="#58a6ff"/>
  <text x="52" y="120" fill="#79c0ff" font-size="13">POST /api/login?debug=1 HTTP/1.1</text>
  <text x="600" y="120" fill="#8b98a5" font-size="11">① method · path · query</text>

  <rect x="40" y="134" width="780" height="86" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="156" fill="#adbac7" font-size="13">Host: app.example.test</text>
  <text x="52" y="176" fill="#adbac7" font-size="13">Authorization: Bearer eyJhbGciOi...</text>
  <text x="52" y="196" fill="#adbac7" font-size="13">Content-Type: application/json</text>
  <text x="600" y="156" fill="#8b98a5" font-size="11">② headers (curl -H)</text>

  <rect x="40" y="222" width="780" height="30" fill="#132b1e" stroke="#2ea043"/>
  <text x="52" y="242" fill="#3fb950" font-size="13">{"user":"alice","pass":"s3cret"}</text>
  <text x="600" y="242" fill="#8b98a5" font-size="11">③ body (curl -d / --data)</text>

  <!-- divider -->
  <line x1="40" y1="272" x2="820" y2="272" stroke="#30363d" stroke-dasharray="4 4"/>

  <!-- RESPONSE -->
  <text x="60" y="300" fill="#3fb950" font-size="15" font-weight="700">RESPONSE  (server → client)</text>
  <rect x="40" y="310" width="780" height="34" fill="#33261a" stroke="#e3a008"/>
  <text x="52" y="332" fill="#f2cc60" font-size="13">HTTP/1.1 401 Unauthorized</text>
  <text x="600" y="332" fill="#8b98a5" font-size="11">④ status line (curl -i)</text>

  <rect x="40" y="346" width="780" height="72" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="368" fill="#adbac7" font-size="13">WWW-Authenticate: Bearer error="invalid_token"</text>
  <text x="52" y="388" fill="#adbac7" font-size="13">Set-Cookie: session=...; HttpOnly; Secure</text>
  <text x="52" y="408" fill="#adbac7" font-size="13">Content-Type: application/json</text>
  <text x="600" y="368" fill="#8b98a5" font-size="11">response headers</text>

  <rect x="40" y="420" width="780" height="30" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="440" fill="#adbac7" font-size="13">{"error":"token expired"}</text>
  <text x="600" y="440" fill="#8b98a5" font-size="11">response body</text>

  <!-- curl map -->
  <rect x="40" y="466" width="780" height="94" fill="#161b22" stroke="#a371f7"/>
  <text x="56" y="490" fill="#d6a2ff" font-size="14" font-weight="700">The same request in curl</text>
  <text x="56" y="514" fill="#8b98a5" font-size="12">curl -i -X POST 'https://app.example.test/api/login?debug=1' \</text>
  <text x="56" y="532" fill="#8b98a5" font-size="12">     -H 'Authorization: Bearer eyJ...' -H 'Content-Type: application/json' \</text>
  <text x="56" y="550" fill="#8b98a5" font-size="12">     -d '{"user":"alice","pass":"s3cret"}'      (-i prints the status+headers)</text>
</svg>
