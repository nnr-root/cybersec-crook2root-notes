<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="560" fill="#0f1420"/>
  <text x="440" y="32" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Where Each Web Tool Sits in the Request Path</text>
  <text x="440" y="54" fill="#8b98a5" font-size="13" text-anchor="middle">the same HTTP request — different tools operate at different points along it</text>

  <!-- pipeline boxes -->
  <g font-size="12.5">
    <rect x="30" y="96" width="120" height="52" rx="6" fill="#1c2333" stroke="#58a6ff"/><text x="90" y="120" fill="#79c0ff" text-anchor="middle" font-weight="700">Client</text><text x="90" y="138" fill="#8b98a5" text-anchor="middle" font-size="11">browser / script</text>
    <rect x="200" y="96" width="130" height="52" rx="6" fill="#2a1c33" stroke="#a371f7"/><text x="265" y="120" fill="#d6a2ff" text-anchor="middle" font-weight="700">Intercepting Proxy</text><text x="265" y="138" fill="#8b98a5" text-anchor="middle" font-size="11">Burp / ZAP :8080</text>
    <rect x="380" y="96" width="90" height="52" rx="6" fill="#33261a" stroke="#e3a008"/><text x="425" y="120" fill="#f2cc60" text-anchor="middle" font-weight="700">WAF</text><text x="425" y="138" fill="#8b98a5" text-anchor="middle" font-size="11">filter</text>
    <rect x="520" y="96" width="110" height="52" rx="6" fill="#132b1e" stroke="#2ea043"/><text x="575" y="120" fill="#3fb950" text-anchor="middle" font-weight="700">Web Server</text><text x="575" y="138" fill="#8b98a5" text-anchor="middle" font-size="11">nginx / IIS</text>
    <rect x="680" y="96" width="80" height="52" rx="6" fill="#161b22" stroke="#30363d"/><text x="720" y="120" fill="#adbac7" text-anchor="middle" font-weight="700">App</text>
    <rect x="790" y="96" width="70" height="52" rx="6" fill="#3a1d24" stroke="#f85149"/><text x="825" y="120" fill="#ff7b72" text-anchor="middle" font-weight="700">DB</text>

    <!-- arrows -->
    <line x1="150" y1="122" x2="198" y2="122" stroke="#8b98a5" stroke-width="1.5"/><polygon points="198,122 190,118 190,126" fill="#8b98a5"/>
    <line x1="330" y1="122" x2="378" y2="122" stroke="#8b98a5" stroke-width="1.5"/><polygon points="378,122 370,118 370,126" fill="#8b98a5"/>
    <line x1="470" y1="122" x2="518" y2="122" stroke="#8b98a5" stroke-width="1.5"/><polygon points="518,122 510,118 510,126" fill="#8b98a5"/>
    <line x1="630" y1="122" x2="678" y2="122" stroke="#8b98a5" stroke-width="1.5"/><polygon points="678,122 670,118 670,126" fill="#8b98a5"/>
    <line x1="760" y1="122" x2="788" y2="122" stroke="#8b98a5" stroke-width="1.5"/><polygon points="788,122 780,118 780,126" fill="#8b98a5"/>
  </g>

  <!-- tool callouts -->
  <g font-size="12.5">
    <!-- curl/postman at client -->
    <rect x="30" y="200" width="150" height="64" fill="#161b22" stroke="#58a6ff"/>
    <text x="42" y="222" fill="#79c0ff" font-weight="700">curl · Postman</text>
    <text x="42" y="242" fill="#8b98a5" font-size="11">hand-craft the request;</text>
    <text x="42" y="258" fill="#8b98a5" font-size="11">no interception</text>
    <line x1="90" y1="200" x2="90" y2="150" stroke="#58a6ff" stroke-dasharray="3 3"/>

    <!-- burp/zap at proxy -->
    <rect x="205" y="200" width="150" height="64" fill="#161b22" stroke="#a371f7"/>
    <text x="217" y="222" fill="#d6a2ff" font-weight="700">Burp · ZAP</text>
    <text x="217" y="242" fill="#8b98a5" font-size="11">intercept &amp; MODIFY any</text>
    <text x="217" y="258" fill="#8b98a5" font-size="11">request in flight; replay</text>
    <line x1="265" y1="200" x2="265" y2="150" stroke="#a371f7" stroke-dasharray="3 3"/>

    <!-- nikto/wpscan at server -->
    <rect x="428" y="200" width="212" height="64" fill="#161b22" stroke="#2ea043"/>
    <text x="440" y="222" fill="#3fb950" font-weight="700">Nikto · WPScan</text>
    <text x="440" y="242" fill="#8b98a5" font-size="11">scan the SERVER: known files,</text>
    <text x="440" y="258" fill="#8b98a5" font-size="11">versions, CMS plugins &#8594; CVEs</text>
    <line x1="560" y1="200" x2="570" y2="150" stroke="#2ea043" stroke-dasharray="3 3"/>

    <!-- sqlmap at db boundary -->
    <rect x="652" y="200" width="208" height="64" fill="#161b22" stroke="#f85149"/>
    <text x="664" y="222" fill="#ff7b72" font-weight="700">SQLmap</text>
    <text x="664" y="242" fill="#8b98a5" font-size="11">targets ONE parameter that</text>
    <text x="664" y="258" fill="#8b98a5" font-size="11">reaches the DB (injection)</text>
    <line x1="800" y1="200" x2="812" y2="150" stroke="#f85149" stroke-dasharray="3 3"/>
  </g>

  <!-- key -->
  <rect x="30" y="300" width="830" height="230" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="326" fill="#e6edf3" font-size="14" font-weight="700">Read the path, pick the tool</text>
  <text x="46" y="352" fill="#79c0ff" font-size="12.5">• curl / Postman — you write the exact bytes. Best for learning HTTP and scripting one precise request.</text>
  <text x="46" y="376" fill="#d6a2ff" font-size="12.5">• Burp / ZAP — sit between client and server; capture real traffic, then edit &amp; replay it (Repeater/Intruder).</text>
  <text x="46" y="400" fill="#3fb950" font-size="12.5">• Nikto / WPScan — automated scanners aimed at the server: known files, versions, CMS plugins → CVEs.</text>
  <text x="46" y="424" fill="#ff7b72" font-size="12.5">• SQLmap — takes ONE request+parameter and probes the app→DB boundary for SQL injection.</text>
  <text x="46" y="454" fill="#8b98a5" font-size="12">The WAF sits in the middle: Burp's match-and-replace and SQLmap's --tamper are how you TEST whether it</text>
  <text x="46" y="472" fill="#8b98a5" font-size="12">can be bypassed — always with explicit authorization.</text>
  <text x="46" y="500" fill="#8b98a5" font-size="12">Workflow: map with the proxy → confirm a bug by hand in Repeater/curl → let SQLmap/scanners go deep on it.</text>
</svg>
