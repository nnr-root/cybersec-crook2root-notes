<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="540" fill="#0f1420"/>
  <text x="440" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Choosing a Language for a Security Tool</text>
  <text x="440" y="52" fill="#8b98a5" font-size="13" text-anchor="middle">four tools, four jobs — reach for the one whose strengths match the task</text>

  <!-- header -->
  <rect x="30" y="70" width="130" height="28" fill="#1c2333" stroke="#30363d"/><text x="40" y="89" fill="#e6edf3" font-size="12" font-weight="700">language</text>
  <rect x="160" y="70" width="430" height="28" fill="#1c2333" stroke="#30363d"/><text x="170" y="89" fill="#3fb950" font-size="12" font-weight="700">reach for it when…</text>
  <rect x="590" y="70" width="260" height="28" fill="#1c2333" stroke="#30363d"/><text x="600" y="89" fill="#ff7b72" font-size="12" font-weight="700">weak at</text>

  <!-- Bash -->
  <rect x="30" y="98" width="130" height="66" fill="#161b22" stroke="#e3a008"/><text x="40" y="128" fill="#f2cc60" font-size="13" font-weight="700">Bash</text><text x="40" y="146" fill="#8b98a5" font-size="10">orchestration</text>
  <rect x="160" y="98" width="430" height="66" fill="#0f1420" stroke="#30363d"/><text x="170" y="122" fill="#adbac7" font-size="11">gluing existing tools together, quick automation, one-liners,</text><text x="170" y="140" fill="#adbac7" font-size="11">pipelines. Composes trusted programs; ships everywhere.</text>
  <rect x="590" y="98" width="260" height="66" fill="#0f1420" stroke="#30363d"/><text x="600" y="122" fill="#8b98a5" font-size="10.5">complex data, state,</text><text x="600" y="140" fill="#8b98a5" font-size="10.5">untrusted input (quoting = injection)</text>

  <!-- Python -->
  <rect x="30" y="166" width="130" height="66" fill="#161b22" stroke="#58a6ff"/><text x="40" y="196" fill="#79c0ff" font-size="13" font-weight="700">Python</text><text x="40" y="214" fill="#8b98a5" font-size="10">rapid dev</text>
  <rect x="160" y="166" width="430" height="66" fill="#0f1420" stroke="#30363d"/><text x="170" y="190" fill="#adbac7" font-size="11">prototyping, parsing, automation, and the huge security lib</text><text x="170" y="208" fill="#adbac7" font-size="11">ecosystem (requests, scapy, impacket, pwntools).</text>
  <rect x="590" y="166" width="260" height="66" fill="#0f1420" stroke="#30363d"/><text x="600" y="190" fill="#8b98a5" font-size="10.5">raw speed; deployment</text><text x="600" y="208" fill="#8b98a5" font-size="10.5">needs an interpreter + deps</text>

  <!-- Go -->
  <rect x="30" y="234" width="130" height="66" fill="#161b22" stroke="#2ea043"/><text x="40" y="264" fill="#3fb950" font-size="13" font-weight="700">Go</text><text x="40" y="282" fill="#8b98a5" font-size="10">deployable speed</text>
  <rect x="160" y="234" width="430" height="66" fill="#0f1420" stroke="#30363d"/><text x="170" y="258" fill="#adbac7" font-size="11">concurrent scanners/agents you DROP as one static binary on</text><text x="170" y="276" fill="#adbac7" font-size="11">any host — cheap goroutines, easy cross-compile, memory-safe.</text>
  <rect x="590" y="234" width="260" height="66" fill="#0f1420" stroke="#30363d"/><text x="600" y="258" fill="#8b98a5" font-size="10.5">low-level memory /</text><text x="600" y="276" fill="#8b98a5" font-size="10.5">byte-exact control</text>

  <!-- C++ -->
  <rect x="30" y="302" width="130" height="66" fill="#161b22" stroke="#f85149"/><text x="40" y="332" fill="#ff7b72" font-size="13" font-weight="700">C++</text><text x="40" y="350" fill="#8b98a5" font-size="10">max control</text>
  <rect x="160" y="302" width="430" height="66" fill="#0f1420" stroke="#30363d"/><text x="170" y="326" fill="#adbac7" font-size="11">line-rate packet parsers, exploit dev, performance-critical or</text><text x="170" y="344" fill="#adbac7" font-size="11">low-level work where you need every byte and cycle.</text>
  <rect x="590" y="302" width="260" height="66" fill="#0f1420" stroke="#30363d"/><text x="600" y="326" fill="#ff7b72" font-size="10.5">MEMORY SAFETY —</text><text x="600" y="344" fill="#8b98a5" font-size="10.5">the bugs you exploit elsewhere</text>

  <!-- key -->
  <rect x="30" y="382" width="820" height="150" fill="#161b22" stroke="#a371f7"/>
  <text x="46" y="408" fill="#d6a2ff" font-size="14" font-weight="700">Graduate up the ladder as the task demands</text>
  <text x="46" y="434" fill="#8b98a5" font-size="12">Start where dev-speed is highest and move right as you need performance, deployment, or control:</text>
  <text x="46" y="458" fill="#f2cc60" font-size="12.5">Bash (glue)  →  Python (build it fast)  →  Go (ship a fast binary)  →  C++ (squeeze the last cycle)</text>
  <text x="46" y="484" fill="#8b98a5" font-size="12">The security lens: Python &amp; Go are memory-safe; C++ is not — the same power that makes it fast is the class of</text>
  <text x="46" y="502" fill="#8b98a5" font-size="12">bug (overflows, UAF) you exploit in the Exploit-Development branch. Use C++ only when you must, and with sanitizers.</text>
  <text x="46" y="524" fill="#3fb950" font-size="12">Rule of thumb: don't reach for a lower level than the problem needs — most security tooling is Python or Go.</text>
</svg>
