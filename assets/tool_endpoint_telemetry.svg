<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="560" fill="#0f1420"/>
  <text x="440" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Endpoint Visibility — Event Stream vs. State Query</text>
  <text x="440" y="52" fill="#8b98a5" font-size="13" text-anchor="middle">Sysmon streams what HAPPENED, in order; osquery answers what is TRUE right now</text>

  <!-- LEFT: Sysmon -->
  <rect x="30" y="72" width="390" height="292" fill="#161b22" stroke="#a371f7"/>
  <text x="44" y="96" fill="#d6a2ff" font-size="15" font-weight="700">Sysmon (Windows) · EVENT STREAM</text>
  <text x="44" y="118" fill="#8b98a5" font-size="12">a continuous, ordered feed of security events</text>
  <text x="44" y="136" fill="#8b98a5" font-size="12">→ Windows Event Log → SIEM/EDR</text>
  <g font-size="11.5">
    <rect x="44" y="148" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="165" fill="#adbac7">ID 1  · ProcessCreate  (cmdline, hashes, parent)</text>
    <rect x="44" y="174" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="191" fill="#adbac7">ID 3  · NetworkConnect (proc → dst ip:port)</text>
    <rect x="44" y="200" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="217" fill="#adbac7">ID 7  · ImageLoad      (DLL / module loaded)</text>
    <rect x="44" y="226" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="243" fill="#adbac7">ID 8  · CreateRemoteThread (injection)</text>
    <rect x="44" y="252" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="269" fill="#adbac7">ID 11 · FileCreate</text>
    <rect x="44" y="278" width="362" height="24" fill="#0f1420" stroke="#30363d"/><text x="52" y="295" fill="#adbac7">ID 22 · DNSQuery</text>
  </g>
  <text x="44" y="326" fill="#3fb950" font-size="12" font-weight="700">answers: WHAT HAPPENED (a timeline)</text>
  <text x="44" y="346" fill="#8b98a5" font-size="11">config decides what's recorded — too broad = flood</text>

  <!-- RIGHT: osquery -->
  <rect x="460" y="72" width="390" height="292" fill="#161b22" stroke="#58a6ff"/>
  <text x="474" y="96" fill="#79c0ff" font-size="15" font-weight="700">osquery (Win/Lin/mac) · STATE as SQL</text>
  <text x="474" y="118" fill="#8b98a5" font-size="12">the endpoint exposed as a SQL database you</text>
  <text x="474" y="136" fill="#8b98a5" font-size="12">query on demand (or on a schedule):</text>
  <rect x="474" y="148" width="362" height="46" fill="#0f1420" stroke="#30363d"/>
  <text x="482" y="166" fill="#f2cc60" font-size="10.5">SELECT name,path FROM processes</text>
  <text x="482" y="184" fill="#f2cc60" font-size="10.5">WHERE on_disk = 0;   -- process, file deleted</text>
  <g font-size="11.5">
    <text x="474" y="216" fill="#adbac7">tables: processes · listening_ports · users</text>
    <text x="474" y="236" fill="#adbac7">        startup_items · crontab · kernel_modules</text>
    <text x="474" y="256" fill="#adbac7">        installed_applications · logged_in_users</text>
  </g>
  <text x="474" y="290" fill="#8b98a5" font-size="11">one query fans out across the WHOLE fleet (via a</text>
  <text x="474" y="308" fill="#8b98a5" font-size="11">manager: Fleet/Kolide) → live IR sweep</text>
  <text x="474" y="336" fill="#3fb950" font-size="12" font-weight="700">answers: WHAT IS TRUE NOW (a snapshot)</text>

  <!-- key -->
  <rect x="30" y="380" width="820" height="162" fill="#161b22" stroke="#a371f7"/>
  <text x="46" y="406" fill="#d6a2ff" font-size="14" font-weight="700">Stream vs. snapshot — you want both</text>
  <text x="46" y="432" fill="#8b98a5" font-size="12">Sysmon = the CCTV: a continuous recording of events, so you can replay exactly what a process did and when</text>
  <text x="46" y="452" fill="#8b98a5" font-size="12">  (replay the attack timeline; write detections on Event IDs). It only sees what its config chooses to log.</text>
  <text x="46" y="478" fill="#8b98a5" font-size="12">osquery = the flashlight: ask any endpoint (or all of them) a question and get the current answer — perfect for</text>
  <text x="46" y="498" fill="#8b98a5" font-size="12">  hunting ("which hosts run a process from a deleted file?") and inventory. A snapshot, not a continuous feed.</text>
  <text x="46" y="524" fill="#3fb950" font-size="12">Sysmon answers "what happened?"; osquery answers "what is true right now?" — together = endpoint visibility.</text>
</svg>
