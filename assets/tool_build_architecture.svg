<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="560" fill="#0f1420"/>
  <text x="440" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Anatomy of a Well-Built Security Tool</text>
  <text x="440" y="52" fill="#8b98a5" font-size="13" text-anchor="middle">separate the engine from the edges — that's what turns a one-off script into a tool</text>

  <!-- layered bands (input flows top → bottom) -->
  <rect x="40" y="72" width="560" height="52" fill="#1c2333" stroke="#58a6ff"/>
  <text x="54" y="93" fill="#79c0ff" font-size="13" font-weight="700">1 · CLI + Config  (the EDGE)</text>
  <text x="54" y="113" fill="#8b98a5" font-size="11">parse argv/env · load scope/targets/rate · the only layer that touches the outside</text>

  <rect x="40" y="130" width="560" height="52" fill="#132b1e" stroke="#2ea043"/>
  <text x="54" y="151" fill="#3fb950" font-size="13" font-weight="700">2 · Core Engine  (pure logic)</text>
  <text x="54" y="171" fill="#8b98a5" font-size="11">the real work (scan/hash/shred), NO I/O → unit-testable without a network or disk</text>

  <rect x="40" y="188" width="560" height="52" fill="#2a1c33" stroke="#a371f7"/>
  <text x="54" y="209" fill="#d6a2ff" font-size="13" font-weight="700">3 · Plugins / Modules  (strategy pattern)</text>
  <text x="54" y="229" fill="#8b98a5" font-size="11">add a capability WITHOUT editing the engine — new scan type / algo = a new module</text>

  <rect x="40" y="246" width="560" height="52" fill="#33261a" stroke="#e3a008"/>
  <text x="54" y="267" fill="#f2cc60" font-size="13" font-weight="700">4 · Concurrency + Rate  (bounded)</text>
  <text x="54" y="287" fill="#8b98a5" font-size="11">worker pool + semaphore + rate limiter — fast, but never a self-DoS or flood</text>

  <rect x="40" y="304" width="560" height="52" fill="#3a1d24" stroke="#f85149"/>
  <text x="54" y="325" fill="#ff7b72" font-size="13" font-weight="700">5 · Structured Output  (evidence)</text>
  <text x="54" y="345" fill="#8b98a5" font-size="11">machine-readable JSONL + human logs · run id, version, timestamps → REPRODUCIBLE</text>

  <!-- flow arrows -->
  <g stroke="#8b98a5" stroke-width="1.4">
    <line x1="320" y1="124" x2="320" y2="130"/><line x1="320" y1="182" x2="320" y2="188"/>
    <line x1="320" y1="240" x2="320" y2="246"/><line x1="320" y1="298" x2="320" y2="304"/>
  </g>

  <!-- cross-cutting sidebar -->
  <rect x="620" y="72" width="220" height="284" fill="#161b22" stroke="#30363d"/>
  <text x="634" y="94" fill="#e6edf3" font-size="13" font-weight="700">Cross-cutting</text>
  <text x="634" y="120" fill="#8b98a5" font-size="11.5">• error handling that</text>
  <text x="634" y="136" fill="#8b98a5" font-size="11.5">  fails loud, not silent</text>
  <text x="634" y="160" fill="#8b98a5" font-size="11.5">• --dry-run / scope guard</text>
  <text x="634" y="184" fill="#8b98a5" font-size="11.5">• unit tests on the engine</text>
  <text x="634" y="208" fill="#8b98a5" font-size="11.5">• no secrets in logs</text>
  <text x="634" y="232" fill="#8b98a5" font-size="11.5">• pin versions / deps</text>
  <text x="634" y="256" fill="#8b98a5" font-size="11.5">• idempotent + resumable</text>
  <text x="634" y="288" fill="#3fb950" font-size="11.5" font-weight="700">these apply to EVERY</text>
  <text x="634" y="304" fill="#3fb950" font-size="11.5" font-weight="700">layer, not just one</text>

  <!-- key -->
  <rect x="40" y="372" width="800" height="170" fill="#161b22" stroke="#a371f7"/>
  <text x="56" y="398" fill="#d6a2ff" font-size="14" font-weight="700">The one rule that carries the rest</text>
  <text x="56" y="424" fill="#8b98a5" font-size="12">Keep the CORE ENGINE free of I/O. If your scanning/hashing logic doesn't import argparse or open a socket, you</text>
  <text x="56" y="444" fill="#8b98a5" font-size="12">can test it with plain inputs, reuse it as a library, and swap the CLI or output format without touching it.</text>
  <text x="56" y="470" fill="#8b98a5" font-size="12">Everything else follows: capabilities become plugins around the engine; concurrency wraps it; the edges (CLI in,</text>
  <text x="56" y="490" fill="#8b98a5" font-size="12">JSON out) are thin and replaceable. A script mixes all five layers into one file — a tool separates them.</text>
  <text x="56" y="518" fill="#f2cc60" font-size="12">For authorized security tools, the scope guard and reproducible evidence layers are not optional — they're the</text>
  <text x="56" y="536" fill="#f2cc60" font-size="12">difference between a defensible engagement artifact and a liability.</text>
</svg>
