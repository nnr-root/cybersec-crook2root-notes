<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="880" height="560" fill="#0f1420"/>
  <text x="440" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Passive Reconnaissance — Mapping a Target Without Touching It</text>
  <text x="440" y="52" fill="#8b98a5" font-size="13" text-anchor="middle">you query third-party data sources; the target's own servers never see a packet</text>

  <!-- TOOLS column -->
  <text x="140" y="86" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">the tools</text>
  <rect x="30" y="98" width="220" height="46" fill="#1c2333" stroke="#58a6ff"/><text x="42" y="120" fill="#79c0ff" font-size="12.5">theHarvester</text><text x="42" y="137" fill="#8b98a5" font-size="10.5">emails · subdomains · hosts</text>
  <rect x="30" y="152" width="220" height="46" fill="#2a1c33" stroke="#a371f7"/><text x="42" y="174" fill="#d6a2ff" font-size="12.5">Amass</text><text x="42" y="191" fill="#8b98a5" font-size="10.5">deep subdomain / DNS graph</text>
  <rect x="30" y="206" width="220" height="46" fill="#132b1e" stroke="#2ea043"/><text x="42" y="228" fill="#3fb950" font-size="12.5">Shodan</text><text x="42" y="245" fill="#8b98a5" font-size="10.5">exposed services (pre-scanned)</text>

  <!-- SOURCES column -->
  <text x="440" y="86" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">public data sources (third parties)</text>
  <g font-size="11.5">
    <rect x="300" y="98" width="280" height="30" fill="#161b22" stroke="#30363d"/><text x="312" y="118" fill="#adbac7">Certificate Transparency (crt.sh)</text>
    <rect x="300" y="130" width="280" height="30" fill="#161b22" stroke="#30363d"/><text x="312" y="150" fill="#adbac7">Search engines · web archives</text>
    <rect x="300" y="162" width="280" height="30" fill="#161b22" stroke="#30363d"/><text x="312" y="182" fill="#adbac7">DNS · WHOIS · ASN datasets</text>
    <rect x="300" y="194" width="280" height="30" fill="#161b22" stroke="#30363d"/><text x="312" y="214" fill="#adbac7">PGP keyservers · breach dumps</text>
    <rect x="300" y="226" width="280" height="30" fill="#161b22" stroke="#30363d"/><text x="312" y="246" fill="#adbac7">Shodan's internet-wide scan DB</text>
  </g>
  <line x1="250" y1="121" x2="298" y2="140" stroke="#58a6ff" stroke-width="1"/>
  <line x1="250" y1="175" x2="298" y2="180" stroke="#a371f7" stroke-width="1"/>
  <line x1="250" y1="229" x2="298" y2="241" stroke="#2ea043" stroke-width="1"/>

  <!-- passive boundary -->
  <line x1="620" y1="92" x2="620" y2="270" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="620" y="286" fill="#ff7b72" font-size="10.5" text-anchor="middle">the target (untouched)</text>

  <!-- ATTACK SURFACE -->
  <text x="740" y="86" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">reconstructed surface</text>
  <g font-size="11.5">
    <rect x="650" y="98" width="210" height="34" fill="#33261a" stroke="#e3a008"/><text x="662" y="119" fill="#f2cc60">subdomains &amp; hosts</text>
    <rect x="650" y="136" width="210" height="34" fill="#33261a" stroke="#e3a008"/><text x="662" y="157" fill="#f2cc60">IPs · netblocks · ASN</text>
    <rect x="650" y="174" width="210" height="34" fill="#33261a" stroke="#e3a008"/><text x="662" y="195" fill="#f2cc60">open services + versions</text>
    <rect x="650" y="212" width="210" height="34" fill="#33261a" stroke="#e3a008"/><text x="662" y="233" fill="#f2cc60">emails · employees · tech</text>
  </g>
  <line x1="580" y1="140" x2="648" y2="150" stroke="#8b98a5" stroke-width="1"/>
  <line x1="580" y1="180" x2="648" y2="190" stroke="#8b98a5" stroke-width="1"/>

  <!-- key -->
  <rect x="30" y="300" width="830" height="240" fill="#161b22" stroke="#a371f7"/>
  <text x="46" y="326" fill="#d6a2ff" font-size="14" font-weight="700">Passive vs. active — the line that matters</text>
  <text x="46" y="352" fill="#8b98a5" font-size="12">PASSIVE: you query third parties (crt.sh, Shodan, search engines). The target logs nothing — you are invisible.</text>
  <text x="46" y="372" fill="#8b98a5" font-size="12">  Shodan is the extreme case: it already scanned the whole internet, so you read its results instead of scanning.</text>
  <text x="46" y="398" fill="#8b98a5" font-size="12">ACTIVE: you send traffic to the target itself — DNS brute-force (amass -brute), port scanning (Nmap). Now you</text>
  <text x="46" y="418" fill="#8b98a5" font-size="12">  appear in THEIR logs. Amass straddles the line: default enum is passive; -active / -brute cross it.</text>
  <text x="46" y="450" fill="#79c0ff" font-size="12">theHarvester — breadth of OSINT sources → emails for phishing sims + a first host list</text>
  <text x="46" y="470" fill="#d6a2ff" font-size="12">Amass — the deepest subdomain graph (cert transparency + DNS + optional active brute)</text>
  <text x="46" y="490" fill="#3fb950" font-size="12">Shodan — what's already exposed and indexed: open DBs, panels, versions — before you send one packet</text>
  <text x="46" y="518" fill="#8b98a5" font-size="12">Order of operations: passive first (quiet, free findings) → then active only within scope, when you must confirm.</text>
</svg>
