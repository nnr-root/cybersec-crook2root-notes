<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="820" height="600" fill="#0f1420"/>
  <text x="410" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">x86-64 Register File &amp; System V ABI</text>
  <text x="410" y="56" fill="#8b98a5" font-size="13" text-anchor="middle">64-bit registers alias down to 32/16/8-bit views; the ABI fixes which registers pass arguments</text>

  <!-- sub-register aliasing bar for RAX -->
  <text x="40" y="92" fill="#e6edf3" font-size="14" font-weight="700">Sub-register aliasing (RAX shown)</text>
  <rect x="40" y="100" width="560" height="34" fill="#1c2333" stroke="#58a6ff"/>
  <text x="50" y="122" fill="#79c0ff" font-size="13">RAX — bits 63..0</text>
  <rect x="320" y="100" width="280" height="34" fill="#233047" stroke="#58a6ff"/>
  <text x="330" y="122" fill="#79c0ff" font-size="13">EAX — 31..0</text>
  <rect x="460" y="100" width="140" height="34" fill="#2b3b57" stroke="#58a6ff"/>
  <text x="470" y="122" fill="#79c0ff" font-size="12">AX 15..0</text>
  <rect x="530" y="100" width="70" height="34" fill="#33486b" stroke="#58a6ff"/>
  <text x="565" y="122" fill="#cfe4ff" font-size="12" text-anchor="middle">AL</text>

  <!-- GPR grid -->
  <text x="40" y="172" fill="#e6edf3" font-size="14" font-weight="700">General-purpose registers</text>
  <g font-size="13">
    <!-- row1 -->
    <rect x="40"  y="182" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="204" fill="#adbac7">RAX ret val</text>
    <rect x="168" y="182" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="180" y="204" fill="#adbac7">RBX callee</text>
    <rect x="296" y="182" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="308" y="204" fill="#adbac7">RCX arg4</text>
    <rect x="424" y="182" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="436" y="204" fill="#adbac7">RDX arg3</text>
    <!-- row2 -->
    <rect x="40"  y="220" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="242" fill="#adbac7">RSI arg2</text>
    <rect x="168" y="220" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="180" y="242" fill="#adbac7">RDI arg1</text>
    <rect x="296" y="220" width="120" height="34" fill="#33261a" stroke="#e3a008"/><text x="308" y="242" fill="#f2cc60">RBP frame</text>
    <rect x="424" y="220" width="120" height="34" fill="#3a1d24" stroke="#f85149"/><text x="436" y="242" fill="#ff7b72">RSP stack</text>
    <!-- row3 -->
    <rect x="40"  y="258" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="280" fill="#adbac7">R8 arg5</text>
    <rect x="168" y="258" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="180" y="280" fill="#adbac7">R9 arg6</text>
    <rect x="296" y="258" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="308" y="280" fill="#adbac7">R10 temp</text>
    <rect x="424" y="258" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="436" y="280" fill="#adbac7">R11 temp</text>
    <!-- row4 -->
    <rect x="40"  y="296" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="52" y="318" fill="#adbac7">R12 callee</text>
    <rect x="168" y="296" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="180" y="318" fill="#adbac7">R13 callee</text>
    <rect x="296" y="296" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="308" y="318" fill="#adbac7">R14 callee</text>
    <rect x="424" y="296" width="120" height="34" fill="#161b22" stroke="#30363d"/><text x="436" y="318" fill="#adbac7">R15 callee</text>
  </g>

  <!-- RIP -->
  <rect x="40" y="344" width="504" height="34" fill="#132b1e" stroke="#2ea043"/>
  <text x="52" y="366" fill="#3fb950" font-size="13">RIP — instruction pointer (changed only via call/ret/jmp)</text>

  <!-- RFLAGS -->
  <text x="40" y="410" fill="#e6edf3" font-size="14" font-weight="700">RFLAGS (condition bits set by ALU)</text>
  <g font-size="12">
    <rect x="40"  y="420" width="70" height="60" fill="#1c2333" stroke="#a371f7"/><text x="60" y="447" fill="#d6a2ff" text-anchor="middle">CF</text><text x="75" y="470" fill="#8b98a5" text-anchor="middle" font-size="11">carry</text>
    <rect x="118" y="420" width="70" height="60" fill="#1c2333" stroke="#a371f7"/><text x="138" y="447" fill="#d6a2ff" text-anchor="middle">ZF</text><text x="153" y="470" fill="#8b98a5" text-anchor="middle" font-size="11">zero</text>
    <rect x="196" y="420" width="70" height="60" fill="#1c2333" stroke="#a371f7"/><text x="216" y="447" fill="#d6a2ff" text-anchor="middle">SF</text><text x="231" y="470" fill="#8b98a5" text-anchor="middle" font-size="11">sign</text>
    <rect x="274" y="420" width="70" height="60" fill="#1c2333" stroke="#a371f7"/><text x="294" y="447" fill="#d6a2ff" text-anchor="middle">OF</text><text x="309" y="470" fill="#8b98a5" text-anchor="middle" font-size="11">overflow</text>
  </g>

  <!-- SysV arg call panel -->
  <rect x="600" y="182" width="188" height="296" fill="#161b22" stroke="#30363d"/>
  <text x="694" y="206" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">SysV arg order</text>
  <text x="616" y="236" fill="#79c0ff" font-size="13">1  RDI</text>
  <text x="616" y="262" fill="#79c0ff" font-size="13">2  RSI</text>
  <text x="616" y="288" fill="#79c0ff" font-size="13">3  RDX</text>
  <text x="616" y="314" fill="#79c0ff" font-size="13">4  RCX</text>
  <text x="616" y="340" fill="#79c0ff" font-size="13">5  R8</text>
  <text x="616" y="366" fill="#79c0ff" font-size="13">6  R9</text>
  <text x="616" y="398" fill="#8b98a5" font-size="12">7+  on the stack</text>
  <text x="616" y="424" fill="#3fb950" font-size="13">ret → RAX</text>
  <text x="616" y="450" fill="#8b98a5" font-size="12">(Windows x64 uses</text>
  <text x="616" y="466" fill="#8b98a5" font-size="12">RCX,RDX,R8,R9)</text>

  <text x="410" y="516" fill="#8b98a5" font-size="12" text-anchor="middle">Why it matters for exploitation: a ROP chain must load RDI (1st arg) before calling, e.g., system("/bin/sh").</text>
</svg>
