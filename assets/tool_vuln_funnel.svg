<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="860" height="580" fill="#0f1420"/>
  <text x="430" y="32" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">The Vulnerability-Assessment Funnel</text>
  <text x="430" y="54" fill="#8b98a5" font-size="13" text-anchor="middle">a scanner reports "detected" — the work is narrowing that to "actually exploitable"</text>

  <!-- funnel bars -->
  <rect x="70" y="82" width="720" height="58" fill="#3a1d24" stroke="#f85149"/>
  <text x="430" y="108" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle">RAW SCANNER OUTPUT — hundreds of "detected" findings</text>
  <text x="430" y="128" fill="#8b98a5" font-size="11" text-anchor="middle">Nessus / OpenVAS plugin hits + Nuclei template matches</text>

  <text x="430" y="160" fill="#8b98a5" font-size="12" text-anchor="middle">▼  remove false positives</text>

  <rect x="150" y="172" width="560" height="58" fill="#33261a" stroke="#e3a008"/>
  <text x="430" y="196" fill="#f2cc60" font-size="13" font-weight="700" text-anchor="middle">MINUS false positives</text>
  <text x="430" y="216" fill="#8b98a5" font-size="11" text-anchor="middle">back-ported patch · not reachable · not applicable · informational-only</text>

  <text x="430" y="248" fill="#8b98a5" font-size="12" text-anchor="middle">▼  is there a working exploit?</text>

  <rect x="240" y="260" width="380" height="58" fill="#1c2333" stroke="#58a6ff"/>
  <text x="430" y="284" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle">CONFIRMED PRESENT + exploit exists</text>
  <text x="430" y="304" fill="#8b98a5" font-size="11" text-anchor="middle">SearchSploit: version → public exploit?</text>

  <text x="430" y="336" fill="#8b98a5" font-size="12" text-anchor="middle">▼  reproduce in a lab</text>

  <rect x="315" y="348" width="230" height="54" fill="#132b1e" stroke="#2ea043"/>
  <text x="430" y="372" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">VERIFIED EXPLOITABLE</text>
  <text x="430" y="391" fill="#8b98a5" font-size="11" text-anchor="middle">→ the actual report</text>

  <!-- tool callouts -->
  <text x="70" y="440" fill="#e6edf3" font-size="14" font-weight="700">Where each tool works</text>
  <g font-size="12">
    <text x="70" y="464" fill="#f2cc60">Nessus · OpenVAS</text>
    <text x="230" y="464" fill="#8b98a5">broad AUTHENTICATED scan → wide coverage, many version-based findings (high FP)</text>
    <text x="70" y="488" fill="#58a6ff">Nuclei</text>
    <text x="230" y="488" fill="#8b98a5">template MATCHERS confirm behaviour, not just a version → far lower false-positive rate</text>
    <text x="70" y="512" fill="#3fb950">SearchSploit</text>
    <text x="230" y="512" fill="#8b98a5">bridges "this version is present" → "here is a public exploit to test in a lab"</text>
  </g>

  <rect x="70" y="528" width="720" height="38" fill="#161b22" stroke="#a371f7"/>
  <text x="84" y="552" fill="#d6a2ff" font-size="12">The rule: a scanner finding is a HYPOTHESIS. "Detected" (version match) ≠ "exploitable" (proven). You verify.</text>
</svg>
