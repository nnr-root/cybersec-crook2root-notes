# ═══════════════════════════════════════════════════════════════════════════
#  Crook2Root — Media Production Sidecar
#  Path:  media/<room-id>.yaml
#
#  Production scaffolding lives HERE, never in the note. The note ships only
#  the finished ![[asset]] embed. This file holds research, licences, prompts,
#  capture scripts and render status — and is what media-audit.py validates.
#
#  Tiers (Blueprint §3.1) — always take the lowest tier that works:
#    0  REUSE      existing authoritative diagram with a usable licence
#    1  MERMAID    flows, sequences, state machines, architecture
#    2  SVG        spatial layouts — bytes, frames, memory, registers, disk, RF
#    3  GIF        command sequences over time
#    4  AI VIDEO   conceptual motion only — NEVER for technical accuracy
# ═══════════════════════════════════════════════════════════════════════════

room: net-ethernet-frames          # must match room.id in the note's frontmatter

assets:

  # ── Tier 0 — reuse ────────────────────────────────────────────────────────
  - id: net_ieee_frame_reference
    tier: 0
    kind: png
    role: "IEEE 802.3 frame reference figure"
    file: assets/net_ieee_frame_reference.png
    status: published              # todo | drafted | rendered | inspected | published
    source:
      origin: "IEEE 802.3-2022 §3.1, public specification figure"
      url: "https://example.org/spec"
      licence: "public-domain"
      retrieved: 2026-08-14
    # Tier 0 REQUIRES source.licence. CI rejects a reused asset without one.

  # ── Tier 2 — authored SVG (mandatory for spatial subjects, Standard §4) ───
  - id: net_ethernet_frame
    tier: 2
    kind: svg
    role: "Byte-level field map of the Ethernet II frame"
    file: assets/net_ethernet_frame.svg
    status: published
    licence: authored-internal
    inspected: 2026-08-14          # REQUIRED for tier 2 — rendered and eyeballed.
                                   # SVG label collisions are invisible to text tooling.
    spec:
      background: "#0f1420"
      accent: "#42D4F4"            # Networking domain colour
      prefix: net_                 # domain prefix convention

  # ── Tier 3 — terminal GIF (capture script committed → regenerable) ────────
  - id: net_frame_capture_demo
    tier: 3
    kind: gif
    role: "tcpdump capturing and decoding a single frame"
    file: assets/net_frame_capture_demo.gif
    status: todo
    capture:
      script: media/scripts/net_frame_capture.sh   # committed; CI can re-run it
      cols: 100
      rows: 26
      theme: c2r-dark
      idle_time_limit: 1.5
      speed: 1.3
      max_seconds: 30
    # WHY THIS MATTERS: when tool versions change, CI regenerates the GIF from
    # the script instead of someone re-recording by hand. Media that regenerates
    # itself does not rot — Blueprint §3.4 rule 3.

  # ── Tier 4 — AI video (conceptual only; requires justification) ───────────
  - id: net_encapsulation_concept
    tier: 4
    kind: video
    role: "Conceptual: payload nesting inside headers, layer by layer"
    file: assets/net_encapsulation_concept.mp4
    status: todo
    justification: >
      No accurate static depiction exists because the point is the continuous
      transformation. Tiers 0-3 cannot show nesting as motion. Nothing in this
      asset conveys a factual layout the learner could be misled by.
    # CI rejects any tier-4 asset without a justification.
    higgsfield:
      style_token: C2R_BASE_DARK   # see docs/templates/higgsfield-style-tokens.yaml
      accent: "#42D4F4"
      duration_s: 6
      loop: true
      aspect: "16:9"
      prompt: >
        Abstract dark technical visualization on a near-black background.
        Luminous cyan wireframe rectangles nest inside one another like
        translucent shells, each new shell wrapping the previous from the
        outside in one continuous motion. Thin volumetric light, subtle depth
        of field, slow deliberate dolly-in. Clean, cold, engineered.
        No text, no symbols, no characters of any kind.
      negative: >
        text, letters, numbers, words, labels, logos, watermarks, UI elements,
        human figures, hands, faces, clutter, lens flare, cartoon, photorealism
    overlay:
      labels_svg: assets/net_encapsulation_labels.svg
      note: >
        ALL labels composited in post as SVG. Generative video cannot spell
        technical text reliably and fails silently — Blueprint §3.4 rule 1.
        Compositing also keeps labels editable, translatable and correctable
        without a re-render.

# ── Audit state (maintained by docs/scripts/media-audit.py) ─────────────────
audit:
  last_run: 2026-08-31
  embeds_resolved: true            # every ![[...]] in the note exists on disk
  orphans: 0                       # assets on disk referenced by no sidecar
  uninspected_tier2: 0             # tier-2 assets missing `inspected:`
